[project]
name = "process-anki"
version = "0.1.0"
description = "A local tool that prepares Anki cards from a list of terms"
requires-python = "==3.13.*"
dependencies = [
    "en-core-web-md",
    "fastapi>=0.142.2",
    "jinja2>=3.1.6",
    "openai>=2.24.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "ru-core-news-md",
    "spacy>=3.8.11",
    "uvicorn>=0.54.0",
    "zh-core-web-md",
]


[tool.uv.sources]
zh-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/zh_core_web_md-3.8.0/zh_core_web_md-3.8.0-py3-none-any.whl" }
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
ru-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/ru_core_news_md-3.8.0/ru_core_news_md-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-playwright>=0.9.0",
    "ruff>=0.15.6,<0.16",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ty]
[tool.ty.environment]
python-version = "3.13"

[[tool.ty.overrides]]
include = ["tests/**/*.py"]
[tool.ty.overrides.rules]
invalid-assignment = "ignore"  # More lenient for tests
