repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # ruff and ty run from the project's environment, so they match pyproject.toml.
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
        files: "^(src|tests)/"
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        files: "^(src|tests)/"
      - id: ty
        name: ty type checker
        entry: uv run ty check src tests
        language: system
        pass_filenames: false
        types: [python]
